<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Enterprise 2035 — Mobile Prototype</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b1020;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}
#game{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:fixed;left:12px;right:12px;top:max(12px,env(safe-area-inset-top));display:flex;gap:8px;z-index:5;pointer-events:none}
.card{background:rgba(9,14,30,.82);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:8px 10px;backdrop-filter:blur(8px);font-size:12px}
#objective{position:fixed;left:12px;right:12px;top:74px;z-index:5;background:rgba(10,15,30,.78);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.35;pointer-events:none}
#joystick{position:fixed;left:18px;bottom:max(22px,env(safe-area-inset-bottom));width:116px;height:116px;border-radius:58px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.15);z-index:6;touch-action:none}
#stick{position:absolute;width:54px;height:54px;border-radius:50%;background:rgba(77,177,255,.65);left:31px;top:31px}
#interact{position:fixed;right:22px;bottom:max(32px,env(safe-area-inset-bottom));width:88px;height:88px;border-radius:50%;background:#2b8df2;border:none;color:#fff;font-size:18px;font-weight:700;z-index:6;box-shadow:0 8px 30px rgba(43,141,242,.35)}
#panel{display:none;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.58);align-items:flex-end}
#panel.show{display:flex}
#sheet{width:100%;max-height:78vh;overflow:auto;background:#11182a;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -16px 50px rgba(0,0,0,.45)}
#speaker{font-size:20px;font-weight:800;margin-bottom:8px}
#text{font-size:15px;line-height:1.45;color:#eaf0ff;white-space:pre-line}
.choice,.archbtn,#closebtn{width:100%;margin-top:10px;padding:13px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.13);background:#18223a;color:#fff;text-align:left;font-size:14px}
.archbtn.active{background:#173d57;border-color:#42b8ff}
#archgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
#deploy{background:#1d7e55;text-align:center;font-weight:800}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:150px;z-index:8;background:rgba(10,15,30,.9);border:1px solid rgba(255,255,255,.13);border-radius:12px;padding:10px 14px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;max-width:80%;text-align:center}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="card" id="money">Budget €8.00M</div>
  <div class="card" id="trust">Trust 64</div>
  <div class="card" id="risk">Risk 42</div>
</div>
<div id="objective"></div>
<div id="joystick"><div id="stick"></div></div>
<button id="interact">TALK</button>
<div id="toast"></div><div id="ready" style="position:fixed;right:12px;top:74px;z-index:7;background:rgba(18,120,80,.88);padding:7px 10px;border-radius:10px;font-size:12px">GAME READY</div>

<div id="panel">
  <div id="sheet">
    <div id="speaker"></div>
    <div id="text"></div>
    <div id="choices"></div>
  </div>
</div>

<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
let W,H,dpr=Math.min(2,devicePixelRatio||1);
function resize(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

const world={w:1800,h:1300};
const player={x:330,y:420,r:16,speed:180};
let cam={x:0,y:0}, joy={x:0,y:0,active:false,id:null};
let state=0, budget=8.0, trust=64, risk=42, backlog=8042, auto=18, exceptions=19;
let selected={docai:false,bpa:false,s4:false,human:false,bdc:false,joule:false};

const buildings=[
 {name:'EXECUTIVE HQ',x:160,y:120,w:340,h:230,color:'#1d4d80'},
 {name:'FINANCE',x:680,y:120,w:360,h:230,color:'#795a22'},
 {name:'ARCHITECTURE LAB',x:160,y:620,w:360,h:250,color:'#17606b'},
 {name:'AI / BDC HUB',x:690,y:620,w:370,h:250,color:'#56357a'},
 {name:'SECURITY OPS',x:1260,y:390,w:360,h:250,color:'#7a2f37'}
];
const npcs=[
 {id:'cfo',name:'Anna Keller',role:'CFO',x:820,y:410,color:'#ffbd4a'},
 {id:'arch',name:'Leo Brandt',role:'BTP Architect',x:390,y:930,color:'#42cbe6'},
 {id:'ciso',name:'Marcus Stein',role:'CISO',x:1430,y:720,color:'#ff5b67'},
 {id:'maya',name:'Maya Rao',role:'Chief Data Officer',x:300,y:950,color:'#aa7af5'}
];
const consoles=[
 {id:'finance',label:'Finance Console',x:900,y:420,color:'#ffb23d'},
 {id:'archwall',label:'Architecture Wall',x:520,y:930,color:'#3ad7d1'},
 {id:'deploy',label:'Deploy',x:920,y:930,color:'#5aaef8'}
];

function objective(){
 const texts=[
  'MISSION: The €1.36M Invoice Crisis — walk to FINANCE and talk to CFO Anna Keller.',
  'Talk to the CFO.',
  'Inspect the Finance Console.',
  'Walk to the Architecture Lab and meet Leo.',
  'Use the Architecture Wall to design the solution.',
  'Walk to the AI / BDC Hub and deploy the pilot.',
  'SECURITY INCIDENT — go to Security Ops and talk to Marcus.',
  'Mission complete. Your company remembers these decisions.'
 ];
 document.getElementById('objective').textContent=texts[state]||'';
}
objective(); setTimeout(()=>{const r=document.getElementById('ready'); if(r) r.style.opacity='0';},2500);

function hud(){
 document.getElementById('money').textContent='Budget €'+budget.toFixed(2)+'M';
 document.getElementById('trust').textContent='Trust '+trust;
 document.getElementById('risk').textContent='Risk '+risk;
}
hud();

function toast(t){let el=document.getElementById('toast');el.textContent=t;el.style.opacity=1;setTimeout(()=>el.style.opacity=0,2200)}

function near(o,d=70){return Math.hypot(player.x-o.x,player.y-o.y)<d}
function nearestInteractable(){
 let arr=[];
 if(state===0||state===1)arr.push({...npcs.find(n=>n.id==='cfo'),type:'npc'});
 if(state===2)arr.push({...consoles.find(n=>n.id==='finance'),type:'console'});
 if(state===3)arr.push({...npcs.find(n=>n.id==='arch'),type:'npc'});
 if(state===4)arr.push({...consoles.find(n=>n.id==='archwall'),type:'console'});
 if(state===5)arr.push({...consoles.find(n=>n.id==='deploy'),type:'console'});
 if(state===6)arr.push({...npcs.find(n=>n.id==='ciso'),type:'npc'});
 return arr[0]&&near(arr[0],85)?arr[0]:null;
}

function panel(speaker,text,choices=[]){
 document.getElementById('speaker').textContent=speaker;
 document.getElementById('text').textContent=text;
 const ch=document.getElementById('choices'); ch.innerHTML='';
 choices.forEach(([label,fn])=>{let b=document.createElement('button');b.className='choice';b.textContent=label;b.onclick=fn;ch.appendChild(b)});
 document.getElementById('panel').classList.add('show');
}
function closePanel(){document.getElementById('panel').classList.remove('show')}
function talkCFO(){
 state=1;objective();
 panel('Anna Keller — CFO','We process 110,000 supplier invoices every year. It costs about €1.36M. The backlog is over 8,000. I want 30% lower cost within twelve months — but I will not fund another technology project with no measurable return.',[
 ['Inspect the process before proposing technology',()=>{trust+=4;state=2;hud();objective();closePanel();toast('Good: diagnose before solutioning.')}],
 ['Promise maximum automation immediately',()=>{trust-=6;risk+=8;state=2;hud();objective();closePanel();toast('The CFO is unconvinced by the premature promise.')}]
 ]);
}
function inspectFinance(){
 panel('Finance Operations Console','Backlog: 8,042 invoices\nManual touches per invoice: 3.8\nException rate: 19%\nAverage cost: €12.40\n\nTop failures: missing PO reference, supplier mismatch, duplicate invoice suspicion.\n\nThis is not only an OCR problem. Process, data and controls are involved.',[
 ['Take findings to the Architecture Lab',()=>{state=3;trust+=2;hud();objective();closePanel();toast('You found the real bottlenecks.')}]
 ]);
}
function talkArch(){
 panel('Leo Brandt — BTP Architect','We can use Document AI for extraction, Build Process Automation for exceptions, S/4 integration for validation/posting, BDC for governed supplier context, and Joule for supplier exceptions. Marcus will insist on a human control boundary if AI can influence financial postings.',[
 ['Open the Architecture War Room',()=>{state=4;objective();closePanel();toast('Build the solution at the glowing wall.')}]
 ]);
}
function archPanel(){
 const p=document.getElementById('panel'), sp=document.getElementById('speaker'), tx=document.getElementById('text'), ch=document.getElementById('choices');
 sp.textContent='Architecture War Room';
 tx.textContent='Choose at least 3 components. Your choices change automation, business value, security risk and executive trust.';
 ch.innerHTML='<div id="archgrid"></div><button class="choice" id="deploy">Approve architecture</button>';
 const defs=[['docai','Document AI'],['bpa','Build Process Automation'],['s4','S/4HANA integration'],['human','Human approval'],['bdc','Business Data Cloud'],['joule','Joule agent']];
 const g=document.getElementById('archgrid');
 defs.forEach(([id,label])=>{let b=document.createElement('button');b.className='archbtn'+(selected[id]?' active':'');b.textContent=label;b.onclick=()=>{selected[id]=!selected[id];b.classList.toggle('active')}})
 document.getElementById('deploy').onclick=()=>{
  let n=Object.values(selected).filter(Boolean).length;
  if(n<3){toast('Choose at least 3 components.');return}
  state=5;budget -= selected.bdc ? 0.72 : 0.48;objective();hud();closePanel();toast('Architecture approved. Deploy at AI / BDC Hub.');
 };
 p.classList.add('show');
}
function deploy(){
 let score=0;
 if(selected.docai)score+=2;if(selected.bpa)score+=2;if(selected.s4)score+=2;if(selected.human)score+=2;if(selected.bdc)score+=1;if(selected.joule)score+=1;
 auto=Math.min(88,22+score*6); exceptions=Math.max(5,24-score*2); backlog=Math.max(900,8042-score*620);
 if(selected.joule&&!selected.human){
   risk+=28;trust-=12;state=6;objective();hud();
   panel('SECURITY ALERT','Three weeks into the pilot, the Joule agent created an incorrect posting request because its production authority was too broad.\n\nCISO has frozen autonomous posting. Go to Security Ops and speak to Marcus.',[['Acknowledge',closePanel]]);
 } else {
   risk=Math.max(15,risk-10);trust+=score>=8?10:4;state=7;objective();hud();
   boardReview(score);
 }
}
function ciso(){
 panel('Marcus Stein — CISO','This is why agent authorization must be designed, not assumed. We need least privilege and a human approval boundary for financially material actions.',[
 ['Restrict Joule to recommendation/draft + human approval',()=>{selected.human=true;risk=Math.max(20,risk-24);trust+=8;state=7;hud();objective();boardReview(8)}],
 ['Keep full autonomous posting',()=>{risk+=15;trust-=10;state=7;hud();objective();boardReview(4)}]
 ]);
}
function boardReview(score){
 panel('Board Review — Six Months Later',
 `Automation: ${auto}%\nException rate: ${exceptions}%\nInvoice backlog: ${backlog}\nTrust: ${trust}/100\nRisk: ${risk}/100\n\n${score>=8&&risk<55?'Finance sees measurable savings, Security accepts the control model, and the board approves Phase 2.':'The pilot delivered value, but architecture or governance debt remains. The board limits Phase 2.'}`,
 [['Restart mission',()=>location.reload()]]);
}

document.getElementById('interact').onclick=()=>{
 const o=nearestInteractable();
 if(!o){toast('Move closer to the highlighted person or console.');return}
 if(o.id==='cfo')talkCFO();
 if(o.id==='finance')inspectFinance();
 if(o.id==='arch')talkArch();
 if(o.id==='archwall')archPanel();
 if(o.id==='deploy')deploy();
 if(o.id==='ciso')ciso();
};

const joyEl=document.getElementById('joystick'),stick=document.getElementById('stick');
function setJoy(e){
 const r=joyEl.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy, len=Math.hypot(dx,dy), max=42;
 if(len>max){dx=dx/len*max;dy=dy/len*max}
 joy.x=dx/max;joy.y=dy/max;stick.style.transform=`translate(${dx}px,${dy}px)`;
}
joyEl.addEventListener('pointerdown',e=>{joy.active=true;joy.id=e.pointerId;joyEl.setPointerCapture(e.pointerId);setJoy(e)});
joyEl.addEventListener('pointermove',e=>{if(joy.active&&e.pointerId===joy.id)setJoy(e)});
function endJoy(e){if(e.pointerId!==joy.id)return;joy.active=false;joy.x=joy.y=0;stick.style.transform='translate(0,0)'}
joyEl.addEventListener('pointerup',endJoy);joyEl.addEventListener('pointercancel',endJoy);

function draw(){
 ctx.clearRect(0,0,W,H);
 cam.x=Math.max(0,Math.min(world.w-W,player.x-W/2));
 cam.y=Math.max(0,Math.min(world.h-H,player.y-H/2));
 ctx.save();ctx.translate(-cam.x,-cam.y);
 ctx.fillStyle='#10182a';ctx.fillRect(0,0,world.w,world.h);
 // roads
 ctx.fillStyle='#1c2435';ctx.fillRect(0,470,world.w,110);ctx.fillRect(560,0,95,world.h);ctx.fillRect(1120,0,95,world.h);
 // road markings
 ctx.fillStyle='#4a5367';for(let x=10;x<world.w;x+=70)ctx.fillRect(x,522,36,4);
 buildings.forEach(b=>{
   ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(b.x+10,b.y+12,b.w,b.h);
   ctx.fillStyle=b.color;ctx.fillRect(b.x,b.y,b.w,b.h);
   ctx.fillStyle='rgba(255,255,255,.15)';
   for(let i=0;i<4;i++)for(let j=0;j<2;j++)ctx.fillRect(b.x+35+i*75,b.y+55+j*70,44,34);
   ctx.fillStyle='#fff';ctx.font='700 19px -apple-system';ctx.fillText(b.name,b.x+18,b.y+30);
 });
 consoles.forEach(o=>{
   ctx.fillStyle=o.color;ctx.beginPath();ctx.arc(o.x,o.y,18,0,Math.PI*2);ctx.fill();
   ctx.fillStyle='#fff';ctx.font='12px -apple-system';ctx.fillText(o.label,o.x-38,o.y-28);
 });
 npcs.forEach(n=>{
   ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(n.x,n.y+17,18,8,0,0,Math.PI*2);ctx.fill();
   ctx.fillStyle=n.color;ctx.beginPath();ctx.arc(n.x,n.y,16,0,Math.PI*2);ctx.fill();
   ctx.fillStyle='#fff';ctx.font='12px -apple-system';ctx.fillText(n.name,n.x-32,n.y-25);
 });
 // player
 ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(player.x,player.y+18,20,9,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#43a7ff';ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#fff';ctx.font='700 11px -apple-system';ctx.fillText('YOU',player.x-12,player.y+4);
 // highlight target
 const o=nearestInteractable();
 if(o){ctx.strokeStyle='#ffe36c';ctx.lineWidth=4;ctx.beginPath();ctx.arc(o.x,o.y,32,0,Math.PI*2);ctx.stroke()}
 ctx.restore();
 requestAnimationFrame(draw);
}
let last=performance.now();
function tick(t){
 let dt=Math.min(.033,(t-last)/1000);last=t;
 if(!document.getElementById('panel').classList.contains('show')){
   player.x=Math.max(20,Math.min(world.w-20,player.x+joy.x*player.speed*dt));
   player.y=Math.max(20,Math.min(world.h-20,player.y+joy.y*player.speed*dt));
 }
 const o=nearestInteractable();
 document.getElementById('interact').textContent=o?(o.type==='npc'?'TALK':'USE'):'ACT';
 requestAnimationFrame(tick);
}
requestAnimationFrame(draw);requestAnimationFrame(tick);
</script>
</body></html>
